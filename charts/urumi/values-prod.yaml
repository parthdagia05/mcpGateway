# Production-like VPS (k3s) overrides. SAME charts as local; only these values differ.
#
#   helm upgrade --install urumi charts/urumi -n urumi --create-namespace -f charts/urumi/values-prod.yaml
#
# Before installing (see README "VPS setup"):
#   1. DNS: point store.<domain>, dashboard.<domain> and gateway.<domain> (A records) at the VPS IP.
#      No domain? Use <ip>.nip.io names, e.g. store.203.0.113.10.nip.io (TLS still works with Let's Encrypt).
#   2. cert-manager installed, with a ClusterIssuer named "letsencrypt" (README has the 10-line manifest).
#   3. Images pushed to a registry the VPS can pull from (make push REGISTRY=ghcr.io/<you>).
#   4. The LLM key Secret created by hand: kubectl -n urumi create secret generic urumi-llm --from-literal=api-key=...
#
# What changes vs values-local.yaml, and why:
#   hosts        *.localtest.me → real DNS names
#   TLS          off → on, certificates issued automatically by cert-manager (Let's Encrypt)
#   scheme       http → https (site URL, invite links, MCP URL, Secure cookies all follow it)
#   images       loaded into k3d by hand → pulled from a registry
#   storage      k3s's built-in local-path provisioner (same as k3d); swap for a cloud block-storage class if you have one
#   resources    a little more headroom for real traffic
#   secrets      still generated by Helm on first install and kept; never in this file

global:
  timezone: Asia/Kolkata
  ingressAnnotations:
    cert-manager.io/cluster-issuer: letsencrypt

store:
  host: store.example.com
  scheme: https
  ingressClassName: traefik
  tls:
    enabled: true
    secretName: store-tls
  storageClass: local-path
  mariadb:
    storage: 10Gi
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
  wordpress:
    storage: 10Gi
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { cpu: "1", memory: 768Mi }

woo-mcp:
  image:
    repository: ghcr.io/parthdagia05/urumi-woo-mcp
    tag: "0.2.0"
  replicas: 2

everything-mcp:
  image:
    repository: ghcr.io/parthdagia05/urumi-everything-mcp
    tag: "2.0.0"

gateway:
  host: gateway.example.com
  dashboardHost: dashboard.example.com
  scheme: https
  ingressClassName: traefik
  tls:
    enabled: true
    secretName: gateway-tls
  storageClass: local-path
  replicas: 2
  image:
    repository: ghcr.io/parthdagia05/urumi-gateway
    tag: "0.5.0"
  dashboard:
    image:
      repository: ghcr.io/parthdagia05/urumi-dashboard
      tag: "0.2.0"
  postgres:
    storage: 5Gi
