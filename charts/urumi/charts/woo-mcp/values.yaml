# WooCommerce MCP server defaults. The umbrella's "woo-mcp:" section overrides these.

image:
  repository: urumi/woo-mcp   # locally: built and loaded with "k3d image import"; on a VPS: a registry path
  tag: "0.2.0"
  pullPolicy: IfNotPresent

replicas: 1   # stateless, so this can safely go higher

# Seconds to wait for the store before a tool call returns a "store did not respond" error.
timeoutSeconds: 10

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
