{{- /*
The bearer token woo-mcp requires on every /mcp request.
Two Pods read it: woo-mcp (to check it) and the gateway (to send it, as this upstream's credential).
Members never see it: the gateway injects it server-side on each outbound call.
Generated once, reused on upgrade (lookup).
*/ -}}
{{- $name := printf "%s-woo-mcp-token" .Release.Name }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: urumi
type: Opaque
data:
  token: {{ get $old "token" | default (randAlphaNum 40 | b64enc) }}
