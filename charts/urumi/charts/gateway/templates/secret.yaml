{{- /*
Gateway secrets, generated on first install and kept forever after (lookup), like the store's:
  postgres-password         - the gateway's database password (baked into Postgres on first start)
  encryption-key            - 32 random bytes; encrypts upstream credentials before they go into Postgres
  bootstrap-admin-password  - password of the first admin account (print it with: make gateway-admin-password)
The LLM API key is NOT here: you create that Secret yourself, so it never touches values files or Git.
*/ -}}
{{- $name := printf "%s-gateway" .Release.Name }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: urumi
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ get $old "postgres-password" | default (randAlphaNum 32 | b64enc) }}
  # 32 random letters/digits = a 32-byte AES-256 key (~190 bits of randomness). Encoded twice: the env var
  # then holds base64 text, which the gateway decodes back into those exact 32 bytes.
  encryption-key: {{ get $old "encryption-key" | default (randAlphaNum 32 | b64enc | b64enc) }}
  bootstrap-admin-password: {{ get $old "bootstrap-admin-password" | default (randAlphaNum 16 | b64enc) }}
