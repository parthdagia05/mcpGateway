# Gateway subchart defaults. The umbrella's "gateway:" section overrides these.

image:
  repository: urumi/gateway
  tag: "0.4.1"
  pullPolicy: IfNotPresent

# Stateless MCP endpoint + Postgres LISTEN/NOTIFY → safe to run more than one.
replicas: 2

# Public hostnames. MCP clients use http://<host>/mcp; the dashboard is served on dashboardHost.
host: gateway.example.com
dashboardHost: dashboard.example.com
scheme: http
ingressClassName: traefik
tls:
  enabled: false
  secretName: gateway-tls

bootstrapAdminEmail: admin@urumi.local

# Extra in-cluster hosts admins may register as upstreams (our own woo-mcp and everything-mcp are always allowed).
# Anything else must resolve to a public address (SSRF protection).
allowedInternalHosts: []

# Per-upstream timeout and how often upstreams are re-checked.
upstreamTimeoutSeconds: 15
refreshIntervalSeconds: 15

# Upstreams registered automatically on the FIRST start only. "secretEnv" names an env var below
# whose value (from a Secret) becomes the stored credential.
seedServers:
  - name: woocommerce
    url: http://urumi-woo-mcp:3000/mcp
    authType: bearer
    secretEnv: WOO_MCP_TOKEN
  - name: everything
    url: http://urumi-everything-mcp:3001/mcp
  - name: deepwiki
    url: https://mcp.deepwiki.com/mcp

# Chat agent. The API key is NOT a value here: create the Secret yourself (see README), e.g.
#   kubectl -n urumi create secret generic urumi-llm --from-literal=api-key=...
# provider "openai" = any OpenAI-compatible API (Groq, OpenRouter, OpenAI, Ollama); "gemini" = Google Gemini.
llm:
  provider: openai
  baseUrl: https://api.groq.com/openai/v1
  model: openai/gpt-oss-120b
  secretName: urumi-llm
  secretKey: api-key

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 384Mi }

dashboard:
  image:
    repository: urumi/dashboard
    tag: "0.1.1"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

postgres:
  image: postgres:17-alpine
  storage: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

storageClass: ""
