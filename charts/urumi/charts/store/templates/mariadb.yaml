# MariaDB: the store's database. Internal only (ClusterIP Service, no Ingress).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mariadb
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mariadb
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-mariadb
  replicas: 1   # one writer only: two MariaDB processes on the same files would corrupt them
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
        {{- include "store.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999    # the image's "mysql" user
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image }}
          ports:
            - name: mysql
              containerPort: 3306
          # Only read on the FIRST start (empty /var/lib/mysql). After that the users live in the data files.
          env:
            - name: MARIADB_DATABASE
              value: wordpress
            - name: MARIADB_USER
              value: wordpress
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "store.secretName" . }}, key: mariadb-root-password }
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "store.secretName" . }}, key: mariadb-password }
          # healthcheck.sh ships in the image and uses a healthcheck user it creates on first start.
          readinessProbe:   # "can it serve queries?" → InnoDB ready. Failing = no traffic, no restart.
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:    # "is the process alive?" only. Failing = restart, so keep it lenient.
            exec: { command: ["healthcheck.sh", "--connect"] }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources: {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  # Each replica gets its own PVC (data-urumi-mariadb-0), reattached every time the Pod comes back.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mariadb.storage }}
