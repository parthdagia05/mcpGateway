{{- /*
Store passwords, generated on first install and NEVER regenerated.
lookup reads the Secret already in the cluster; if it exists we reuse its values, so a helm upgrade
can't change a password that MariaDB already baked into its data files on first start.
Skipped entirely when existingSecret is set (the operator brings their own Secret, e.g. on the VPS).
*/ -}}
{{- if not .Values.existingSecret }}
{{- $name := include "store.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    # Keep the Secret even on "helm uninstall", because the PVC (and the passwords inside it) survive too.
    helm.sh/resource-policy: keep
type: Opaque
data:
  mariadb-root-password: {{ get $old "mariadb-root-password" | default (randAlphaNum 24 | b64enc) }}
  mariadb-password: {{ get $old "mariadb-password" | default (randAlphaNum 24 | b64enc) }}
  wp-admin-password: {{ get $old "wp-admin-password" | default (randAlphaNum 16 | b64enc) }}
{{- end }}
