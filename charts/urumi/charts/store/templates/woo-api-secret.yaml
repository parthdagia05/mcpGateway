{{- /*
The WooCommerce REST API key that the WooCommerce MCP server uses to talk to the store.

Kept in its OWN Secret (not with the database passwords) so the MCP server can be given this
and nothing else: if the MCP server were compromised, it still couldn't read the DB passwords.

Generated once, reused on every upgrade (same lookup trick as the store passwords).
The setup Job registers this key inside WooCommerce; woo-mcp reads it from here.
*/ -}}
{{- $name := printf "%s-woo-api" .Release.Name }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "store.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  consumer-key: {{ get $old "consumer-key" | default (printf "ck_%s" (randAlphaNum 40 | lower) | b64enc) }}
  consumer-secret: {{ get $old "consumer-secret" | default (printf "cs_%s" (randAlphaNum 40 | lower) | b64enc) }}
