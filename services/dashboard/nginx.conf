# Serves the built React app. The /api paths never reach this server: the Ingress sends them to the gateway.
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  # Browser hardening: only load scripts/styles/fonts from ourselves, never allow being framed.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # Hashed build files never change, so browsers may cache them for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Single-page app: any other path (e.g. /audit, /invite/<token>) gets index.html; React Router takes over.
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    try_files $uri /index.html;
  }
}
